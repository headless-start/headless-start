name: generate-snake

# Regenerates the contribution-graph snake animation and commits it as static
# SVGs under assets/ (dark + light). The README points at those committed
# files, so it renders reliably.

on:
  schedule:
    - cron: "23 */12 * * *"   # twice a day at :23 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets      # shared with the card workflows so pushes serialise
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark
            assets/snake-light.svg?palette=github-light

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain assets)" ]; then echo "no changes"; exit 0; fi
          git add assets
          git commit -m "regenerate snake animation"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then echo "pushed"; exit 0; fi
            echo "push retry $i"; sleep 3
          done
          echo "push failed after retries"; exit 1

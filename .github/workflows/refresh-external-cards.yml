name: refresh-external-cards

# Refreshes the two cards that have no first-party action (contribution streak
# and the activity graph) by fetching them and committing static SVGs under
# assets/. A response is committed only if it looks like a real card: a valid
# <svg>, no error/rate-limit text, and the known labels that card always
# carries. Anything else is dropped and the previous good copy is kept, so a
# rate-limited response can never replace a good card.

on:
  schedule:
    - cron: "37 6 * * *"     # daily at 06:37 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets      # shared with the other asset workflows so pushes serialise
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cards (validate, keep last good on failure)
        shell: bash
        run: |
          set -u
          mkdir -p assets
          # fetch <dest> <url> <required-label>...  -> only promotes a response
          # that is a valid svg, error-free, and contains every required label.
          fetch() {
            dest="$1"; url="$2"; shift 2
            for attempt in 1 2 3; do
              tmp="$(mktemp)"
              code="$(curl -s -m 30 -o "$tmp" -w '%{http_code}' "$url")"
              if [ "$code" = "200" ] && head -c 256 "$tmp" | grep -qi '<svg'; then
                bad=0
                if grep -qiE 'rate.?limit|maximum retries|too many requests|not in whitelist|cURL error|could not|user not found|ERROR!!!|try again' "$tmp"; then bad=1; fi
                for m in "$@"; do grep -qiF "$m" "$tmp" || bad=1; done
                if [ "$bad" = 0 ]; then mv "$tmp" "$dest"; echo "update $(basename "$dest")"; return 0; fi
              fi
              rm -f "$tmp"; echo "attempt $attempt failed for $(basename "$dest") (HTTP $code)"; sleep 5
            done
            echo "keep $(basename "$dest") - upstream unavailable or invalid"; return 0
          }
          fetch assets/streak.svg \
            "https://streak-stats.demolab.com/?user=headless-start&theme=radical&hide_border=true" \
            "Current Streak" "Total Contributions"
          fetch assets/activity-graph.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=headless-start&theme=react-dark&hide_border=true&bg_color=1a1b27&color=7C7BF7&line=7C7BF7&point=ffffff&area=true" \
            "card_bg"

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain assets)" ]; then echo "no changes"; exit 0; fi
          git add assets
          git commit -m "refresh external cards"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then echo "pushed"; exit 0; fi
            echo "push retry $i"; sleep 3
          done
          echo "push failed after retries"; exit 1

name: refresh-external-cards

# Builds the contribution streak card and the activity graph from GitHub's own
# contribution calendar (scripts/build_contribution_cards.py) and commits them
# as static SVGs under assets/. These used to be fetched from free public card
# services; the activity graph one shut down in August 2026 and the card sat on
# old data, so nothing here depends on an outside service any more. If the
# GitHub API fails, the last good cards are kept.
#
# Every run also:
#   - re-enables all workflows in this repo. GitHub switches off scheduled
#     workflows after 60 days without repo activity; re-enabling (a no-op
#     while enabled) resets that timer, so the automation never goes quiet.
#   - starts sync-profile, whose health check compares every card with the
#     account. GitHub's hourly cron can lag or skip; this 6-hourly one has
#     been reliable, so the check runs at least four times a day.

on:
  schedule:
    - cron: "37 */6 * * *"   # every 6 hours at :37 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}   # one run of this workflow at a time; the card
                                  # workflows write different files and retry pushes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROFILE_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build streak card and activity graph
        run: python3 scripts/build_contribution_cards.py

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain assets)" ]; then echo "no changes"; exit 0; fi
          git add assets
          git commit -m "refresh external cards"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then echo "pushed"; exit 0; fi
            echo "push retry $i"; sleep 3
          done
          echo "push failed after retries"; exit 1

      - name: Keep every workflow enabled
        if: always()
        shell: bash
        run: |
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[].id'); do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/$id/enable" && echo "enabled $id"
          done

      - name: Run the health check
        if: always()
        run: gh workflow run sync-profile.yml --ref "${GITHUB_REF_NAME}"
